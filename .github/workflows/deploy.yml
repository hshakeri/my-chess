name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Vitest and Playwright (.github/workflows/test.yml); deploy waits for them
  test:
    uses: ./.github/workflows/test.yml

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Build the printable lesson book (HTML + PDF, generated at deploy time, never tracked)
        run: |
          npx playwright install --with-deps chromium
          npm run book
          npm run book:pdf
          mkdir -p dist/book
          cp book/lesson-book.html book/lesson-book.pdf dist/book/
          # /my-chess/book/ opens the app's Book tab, which shows every page of the PDF
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>Lesson Book</title><meta http-equiv="refresh" content="0; url=../#/book"><a href="../#/book">Open the lesson book</a>' > dist/book/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [test, build]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
