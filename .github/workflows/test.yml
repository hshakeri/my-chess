name: Tests

# The unit and browser suites. They run on every push to a branch other than main, and the deploy
# workflow calls this file before publishing, so nothing reaches GitHub Pages unless both pass.
on:
  push:
    branches-ignore:
      - main
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Vitest)
        run: npx vitest run

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser tests (Playwright)
        run: npx playwright test

      # On main the deploy's build job makes the book; on a branch, build it here so a broken book never reaches main
      - name: Build the printable lesson book
        if: github.ref != 'refs/heads/main'
        run: |
          npm run book
          npm run book:pdf

      - name: Keep the lesson book PDF of a branch run
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: lesson-book
          path: book/lesson-book.pdf
          retention-days: 7

      - name: Keep the Playwright report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
